<!DOCTYPE html>
<html lang='en'>

<head>
    <title>Admin Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="site-header">
    <div class="container">
        <a href="index.html" class="site-brand">
            <img src="images/MealMatrixLogo.png" alt="Meal Matrix Logo" class="site-logo" />
            <span>Meal Matrix</span>
        </a>
    </div>
    </header>
    <main class="page-content">
    <div class="page-inner container py-5">
        <div class="row justify-content-center py5">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4">Admin Login</h1>
                        <hr />
                        <form name="adminLoginForm" onsubmit="return loginAdmin()">
                            <label for="adminUserName" class="form-label">Username:</label><br>
                            <input type="text" class="form-control" id="adminUserName" name="adminUserName"
                                required><br><br>
                            <label for="adminPassword" class="form-label">Password:</label><br>
                            <input type="password" class="form-control" id="adminPassword" name="adminPassword"
                                required><br><br>
                            <input type="submit" class="btn btn-primary w-100" value="Login Admin"><br><br>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>
    <script type=text/javascript>
        function loginAdmin() {
            let username = document.getElementById("adminUserName").value;
            let password = document.getElementById("adminPassword").value;
            if(username === "admin" && password === "admin123") {
                alert("Admin login successful!");
                window.location.href = "admin.html";
            } else {
                alert("Invalid username or password. Please try again.");
            }
            return false; 
        }
    </script>
    <footer class="site-footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Meal Matrix. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
