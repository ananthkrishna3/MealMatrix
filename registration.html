<!doctype html>
<html lang="en">
  <head>
    <title>MealMatrix - Customer Registration</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="site-header">
    <div class="container">
        <a href="index.html" class="site-brand">
            <img src="images/MealMatrixLogo.png" alt="Meal Matrix Logo" class="site-logo" />
            <span>Meal Matrix</span>
        </a>
    </div>
    </header>
    <main class="page-content">
    <div class="page-inner">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="text-center mb-4">Customer Registration</h1>
              <hr />
              <form name="addCustomerForm" onsubmit="return addCustomer();">
                <div class="mb-3">
                  <label for="custName" class="form-label">Name:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="custName"
                    name="custName"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="custEmail" class="form-label">Email:</label>
                  <input
                    type="email"
                    class="form-control"
                    id="custEmail"
                    name="custEmail"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="custPhone" class="form-label"
                    >Phone Number:</label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="custPhone"
                    name="custPhone"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="custPassword" class="form-label">Password:</label>
                  <input
                    type="password"
                    class="form-control"
                    id="custPassword"
                    name="custPassword"
                    required
                  />
                </div>
                <input
                  type="submit"
                  class="btn btn-success w-100"
                  value="Register Customer"
                />
              </form>
              <a href="customer-login.html" class="btn btn-link w-100 mt-2"
                >Already registered? Login</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
    </main>
    <script type="text/javascript">
      function addCustomer() {
        let customerName = document.getElementById("custName").value;
        let email = document.getElementById("custEmail").value;
        let phone = document.getElementById("custPhone").value;
        let password = document.getElementById("custPassword").value;
        let cid = 0;
        let custData;

        fetch("http://localhost:3000/customers")
          .then((response) => response.json())
          .then((data) => {
            let customerIds = data.map((customer) => customer.cid);
            if (customerIds.length == 0) {
              cid = 101;
            } else {
              cid = Math.max(...customerIds) + 1;
            }
            custData = {
              cid: cid,
              customerName: customerName,
              phone: phone,
              email: email,
              password: password,
            };
            return custData;
          })
          .then((custData) => {
            return fetch("http://localhost:3000/customers", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(custData),
            }).then((response) => {
              if (response.ok) {
                alert("Customer registered successfully!");
                window.location.href = "customer-login.html";
              } else {
                alert("Error registering customer.");
              }
            });
          })
          .catch((error) => console.log("Error:", error));
        return false; // Prevent default form submission
      }
    </script>
    <footer class="site-footer">
      <div class="container text-center">
        <p class="mb-0">&copy; 2026 Meal Matrix. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
