<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meal Matrix</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="site-header">
    <div class="container">
        <a href="index.html" class="site-brand">
            <img src="images/MealMatrixLogo.png" alt="Meal Matrix Logo" class="site-logo" />
            <span>Meal Matrix</span>
        </a>
    </div>
    </header>
    <main class="container   mainSection">
      <section class="loginSection">
        <h2 class="text-center mb-4">Welcome to Meal Matrix</h2>
        <section class="row justify-content-center g-4 loginOptions">
          <div class="col-md-5">
            <article class="card shadow-sm h-100">
              <div class="card-body text-center">
                <h3 class="card-title mb-3">Administrator Login</h3>

                <a href="admin-login.html" class="btn btn-primary w-100">
                  Login as Admin
                </a>
              </div>
            </article>
          </div>
          <div class="col-md-5">
            <article class="card shadow-sm h-100">
              <div class="card-body text-center">
                <h3 class="card-title mb-3">Customer Login</h3>
                <a
                  href="customer-login.html"
                  class="btn btn-success w-100 mb-2"
                >
                  Login as Customer
                </a>
                <a
                  href="registration.html"
                  class="btn btn-link d-block customerAction newCustomerButton"
                >
                  New Customer? Register
                </a>
              </div>
            </article>
          </div>
        </section>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container text-center">
        <p class="mb-0">&copy; 2026 Meal Matrix. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
