<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MealMatrix - Menu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body onload="displayMenu()">
    <header class="site-header">
    <div class="container">
        <a href="index.html" class="site-brand">
            <img src="images/MealMatrixLogo.png" alt="Meal Matrix Logo" class="site-logo" />
            <span>Meal Matrix</span>
        </a>
    </div>
    </header>
    <main class="page-content">
    <div class="page-inner">
    <div class="container py-4">
      <h1 class="text-center mb-2">MealMatrix - Menu</h1>
      <p class="text-center text-muted mb-4">
        Welcome! Select your food items below.
      </p>

      <div class="table-responsive">
        <table
          class="table table-bordered table-striped table-hover align-middle"
        >
          <thead>
            <tr>
              <th>Food ID</th>
              <th>Food Name</th>
              <th>Price</th>
              <th>Quantity</th>
            </tr>
          </thead>
          <tbody id="menuItems">
            <!-- Menu items will be dynamically inserted here -->
          </tbody>
        </table>
      </div>
      <button
        type="button"
        class="btn btn-success mt-3"
        onclick="proceedToOrder()"
      >
        Proceed to Order
      </button>
    </div>
    </div>
    </main>
    <script type="text/javascript">
      let foodItems = [];
      function displayMenu() {
        fetch("http://localhost:3000/foodItems")
          .then((response) => response.json())
          .then((data) => {
            foodItems = data;
            displayMenuItem(data);
          })
          .catch((error) => console.log("Error:", error));
      }

      function displayMenuItem(menuItems) {
        let rows = "";

        if (menuItems.length === 0) {
          rows = "<tr>";
          rows += "<td colspan='4'>No food items available</td>";
          rows += "</tr>";
        } else {
          menuItems.forEach((food) => {
            rows += "<tr>";
            rows += "<td>" + food.fid + "</td>";
            rows += "<td>" + food.foodName + "</td>";
            rows += "<td>₹" + food.price + "</td>";
            rows += "<td>";
            rows +=
              "<button type='button'  class='btn btn-outline-danger btn-sm'  onclick='changeQuantity(" +
              food.fid +
              ", -1)'>-</button>";
            rows +=
              " <span class='mx-2 fw-bold' id='quantity-" +
              food.fid +
              "'>0</span> ";
            rows +=
              "<button type='button' class='btn btn-outline-success btn-sm'  onclick='changeQuantity(" +
              food.fid +
              ", 1)'>+</button>";
            rows += "</td>";
            rows += "</tr>";
          });
        }
        document.getElementById("menuItems").innerHTML = rows;
      }

      function changeQuantity(foodId, quantityChange) {
        var itemQuantity = parseInt(
          document.getElementById("quantity-" + foodId).innerText,
        );
        itemQuantity += quantityChange;
        if (itemQuantity < 0) {
          itemQuantity = 0;
        }

        document.getElementById("quantity-" + foodId).innerText = itemQuantity;
      }

      function proceedToOrder() {
        const urlParams = new URLSearchParams(window.location.search);
        const cid = parseInt(urlParams.get("cid"));

        let totalPrice = 0;
        let orderItems = [];

        foodItems.forEach((food) => {
          var itemQuantity = parseInt(
            document.getElementById("quantity-" + food.fid).innerText,
          );

          if (itemQuantity > 0) {
            let itemTotalPrice = food.price * itemQuantity;

            totalPrice += itemTotalPrice;

            orderItems.push({
              fid: food.fid,
              foodName: food.foodName,
              price: food.price,
              quantity: itemQuantity,
              itemTotalPrice: itemTotalPrice,
            });
          }
        });

        if (orderItems.length === 0) {
          alert("Please select at least one item to proceed with the order.");
          return;
        }

        fetch("http://localhost:3000/orders")
          .then((response) => response.json())
          .then((data) => {
            let orderIds = data.map((order) => order.orderid);

            let orderid = 0;

            if (orderIds.length == 0) {
              orderid = 101;
            } else {
              orderid = Math.max(...orderIds) + 1;
            }

            let orderData = {
              orderid: orderid,
              cid: cid,
              totalPrice: totalPrice,
              orderItems: orderItems,
              orderDate: new Date().toISOString(),
            };

            return orderData;
          })
          .then((orderData) => {
            return fetch("http://localhost:3000/orders", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(orderData),
            });
          })
          .then((response) => {
            if (response.ok) {
              alert("Order placed successfully!");
            } else {
              alert("Error placing order.");
            }
          })
          .catch((error) => console.log("Error:", error));
      }
    </script>
    <footer class="site-footer">
      <div class="container text-center">
        <p class="mb-0">&copy; 2026 Meal Matrix. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
